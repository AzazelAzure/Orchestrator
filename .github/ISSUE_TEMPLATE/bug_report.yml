name: Bug report
description: Report a defect in Orchestrator
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, commands, and unexpected vs expected behavior. Redact secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: git SHA or package version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, optional extras installed
