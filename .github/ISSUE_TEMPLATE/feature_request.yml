name: Feature request
description: Propose a product-agnostic enhancement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap exists for generic orchestrator users?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Suggested approach. Avoid product-specific adapters unless explicitly scoped as optional plugins outside the core.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints acknowledged
      options:
        - label: This does not require private absolute paths in the repository
          required: true
        - label: This does not introduce private-product branding or linkers into the core
          required: true
