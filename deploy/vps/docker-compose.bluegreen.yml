# Blue/green presentation tier — API slots only. No coordinator, worker, scheduler,
# Redis, script-worker, or data volume. Shared mutation plane stays in the base compose.
services:
  api-blue:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    environment:
      COORDINATOR_URL: http://coordinator:9001
      DJANGO_SETTINGS_MODULE: flow_engine.control_plane.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.thedirectorate.app,127.0.0.1,localhost}
      ORCH_SCRIPT_ROLE: control
      ORCH_API_SERVICE_TOKEN: ${ORCH_API_SERVICE_TOKEN:?ORCH_API_SERVICE_TOKEN is required}
      ORCH_TOKEN_FOUNDER: ${ORCH_TOKEN_FOUNDER:?ORCH_TOKEN_FOUNDER is required}
      ORCH_PROVIDER_MODE: ${ORCH_PROVIDER_MODE:-mock}
      ORCH_LOCAL_BUDGET_SCOPE: ${ORCH_LOCAL_BUDGET_SCOPE:-acceptance-campaign-r4}
      ORCH_ALLOW_USER_REGISTRATION: ${ORCH_ALLOW_USER_REGISTRATION:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://www.thedirectorate.app}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend

  api-green:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    environment:
      COORDINATOR_URL: http://coordinator:9001
      DJANGO_SETTINGS_MODULE: flow_engine.control_plane.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.thedirectorate.app,127.0.0.1,localhost}
      ORCH_SCRIPT_ROLE: control
      ORCH_API_SERVICE_TOKEN: ${ORCH_API_SERVICE_TOKEN:?ORCH_API_SERVICE_TOKEN is required}
      ORCH_TOKEN_FOUNDER: ${ORCH_TOKEN_FOUNDER:?ORCH_TOKEN_FOUNDER is required}
      ORCH_PROVIDER_MODE: ${ORCH_PROVIDER_MODE:-mock}
      ORCH_LOCAL_BUDGET_SCOPE: ${ORCH_LOCAL_BUDGET_SCOPE:-acceptance-campaign-r4}
      ORCH_ALLOW_USER_REGISTRATION: ${ORCH_ALLOW_USER_REGISTRATION:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://www.thedirectorate.app}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8010:8000"
    networks:
      - frontend
      - backend
