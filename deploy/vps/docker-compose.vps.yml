# VPS deployment overlay — publish on all host interfaces so the fm-beta proxy container
# can reach services via host.containers.internal (rootless Podman host-gateway).
# Ensure host firewall blocks public access to :8000/:8081; only :8443 is public.
# API host bind is owned by ORCH_API_BIND in .env.vps (see .env.vps.example).
services:
  api:
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.thedirectorate.app,127.0.0.1,localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://www.thedirectorate.app}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://www.thedirectorate.app,https://api.thedirectorate.app}
      ORCH_ALLOW_USER_REGISTRATION: "0"

  coordinator:
    environment:
      ORCH_ALLOW_USER_REGISTRATION: "0"

  ops-console:
    profiles: ["ops-console-compose-disabled"]
    # Use deploy/vps/run_ops_console.sh — podman-compose cannot start this service reliably.
