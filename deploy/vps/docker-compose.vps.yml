# VPS deployment overlay — publish on all host interfaces so the fm-beta proxy container
# can reach services via host.containers.internal (rootless Podman host-gateway).
# Ensure host firewall blocks public access to :8000/:8081; only :8443 is public.
services:
  api:
    ports:
      - "8000:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.thedirectorate.dev,127.0.0.1,localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://www.thedirectorate.dev}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://www.thedirectorate.dev,https://api.thedirectorate.dev}

  ops-console:
    build:
      context: ./ops-console
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
