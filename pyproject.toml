[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
version = "0.1.0"
description = "Generic SQLite-backed workflow orchestrator core (Python package: flow_engine)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Orchestrator contributors" },
]
keywords = ["workflow", "orchestrator", "sqlite", "gates", "leases"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
flowctl = "flow_engine.cli.app:main"
flowctl-mcp = "flow_engine.mcp.server:main"
orchestrator-host-runner = "flow_engine.providers.host_runner_main:main"
orch-api = "flow_engine.control_plane.manage:main"
orch-coordinator = "flow_engine.coordinator.http_service:main"
orch-mcp-lane = "flow_engine.mcp_lanes.service_main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "pyyaml>=6.0"]
mcp = ["mcp>=1.27,<2"]
api = [
  "django>=5.0",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "django-cors-headers>=4.0",
  "gunicorn>=26.0.0",
  "pytest-django>=4.8",
]
worker = [
  "celery[redis]>=5.4",
  "redis>=5.0",
]
control-plane = [
  "django>=5.0",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "django-cors-headers>=4.0",
  "gunicorn>=26.0.0",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "pytest-django>=4.8",
  "mcp>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flow_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
